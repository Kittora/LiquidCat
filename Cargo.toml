[workspace]
resolver = "3"

[package]
name = "liquidcat"
version = "0.4.4"
edition = "2021"
rust-version = "1.88"
description = "LiquidCat — descargador y convertidor de medios (yt-dlp + ffmpeg), nativo en Rust"
# GPL-3.0: la misma licencia con la que se usa Slint (la interfaz).
license = "GPL-3.0-only"
repository = "https://github.com/Kittora/LiquidCat"
autobins = false

[[bin]]
name = "LiquidCat"
path = "src/main.rs"

[dependencies]
# Renderer: Skia (GPU, vsync) por defecto y software como fallback.
# La seleccion se hace en src/main.rs (LIQUIDCAT_SOFTWARE=1 fuerza software).
slint = { version = "1.14", default-features = false, features = ["std", "backend-winit", "renderer-skia", "renderer-skia-opengl", "renderer-software", "compat-1-2", "unstable-winit-030", "raw-window-handle-06"] }
# Acceso al HWND de la ventana (esquinas redondeadas nativas via DWM en Windows 11).
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
arboard = { version = "3", default-features = false }
open = "5"
# Idioma del sistema (para elegir el idioma de la app la primera vez).
sys-locale = "0.3"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Time", "Win32_Graphics_Dwm", "Win32_Media_Audio", "Win32_Devices_DeviceAndDriverInstallation"] }
# DXGI (detectar la GPU), notificaciones (WinRT) y el acceso directo del menu
# Inicio (COM), sin lanzar PowerShell.
windows = { version = "0.62", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Data_Xml_Dom", "UI_Notifications", "Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_UI_Shell", "Win32_UI_Shell_PropertiesSystem", "Win32_Storage_EnhancedStorage"] }

[target.'cfg(not(windows))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[build-dependencies]
slint-build = "1.14"

# Icono y metadatos del .exe de Windows (rc.exe del toolchain MSVC).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

[profile.dev]
debug = false
opt-level = 0
incremental = false
codegen-units = 16
