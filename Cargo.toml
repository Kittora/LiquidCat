[workspace]
resolver = "3"

[package]
name = "liquidcat"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "LiquidCat — descargador y convertidor de medios (yt-dlp + ffmpeg), nativo en Rust"

[dependencies]
# Renderer: FemtoVG (OpenGL, vsync) por defecto y software como fallback.
# La seleccion se hace en src/main.rs (LIQUIDCAT_SOFTWARE=1 fuerza software).
slint = { version = "1.14", default-features = false, features = ["std", "backend-winit", "renderer-femtovg", "renderer-software", "compat-1-2", "unstable-winit-030", "raw-window-handle-06"] }
# Acceso al HWND de la ventana (esquinas redondeadas nativas via DWM en Windows 11).
raw-window-handle = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["platform-verifier"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
arboard = { version = "3", default-features = false }
open = "5"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_System_Diagnostics_Debug", "Win32_System_Time", "Win32_Graphics_Dwm"] }

[target.'cfg(not(windows))'.dependencies]
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[build-dependencies]
slint-build = "1.14"

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 4
panic = "abort"
strip = true

[profile.dev]
debug = false
opt-level = 0
incremental = false
codegen-units = 16
